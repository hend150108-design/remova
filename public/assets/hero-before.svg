<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Rich studio gradient background for Before state -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Studio Wall & Floor Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#spotlight)" />

  <!-- Studio Floor horizon line -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#94A3B8" stroke-width="1" opacity="0.4"/>

  <!-- Sneaker Cutout Graphic with Shadow -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Sneaker Outsole -->
    <path d="M40 220 C70 235, 140 238, 200 230 C270 222, 340 226, 420 236 C440 238, 455 230, 460 215 C465 200, 445 190, 430 190 C360 190, 300 185, 240 195 C170 205, 100 200, 45 195 C30 195, 25 210, 40 220 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Air Cushion Capsule -->
    <rect x="90" y="202" width="75" height="16" rx="8" fill="#2563EB" opacity="0.85"/>
    <line x1="110" y1="202" x2="110" y2="218" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="130" y1="202" x2="130" y2="218" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="150" y1="202" x2="150" y2="218" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Midsole & Upper Body -->
    <path d="M48 195 C65 170, 110 155, 160 150 C210 145, 250 115, 280 75 C295 55, 315 50, 335 60 C350 70, 360 95, 375 115 C400 145, 435 170, 440 190 C420 188, 350 184, 250 190 C150 195, 80 194, 48 195 Z" fill="#0F172A"/>

    <!-- Dynamic Swoosh / Wave Line -->
    <path d="M120 180 C200 170, 270 120, 370 115 C330 140, 260 190, 150 192 Z" fill="#2563EB"/>

    <!-- Collar & Tongue -->
    <path d="M260 90 C280 65, 310 55, 330 65 C320 85, 310 115, 300 140 C280 140, 265 120, 260 90 Z" fill="#1E293B"/>

    <!-- Laces -->
    <line x1="285" y1="95" x2="310" y2="105" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="295" y1="115" x2="325" y2="125" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="310" y1="135" x2="345" y2="145" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="330" y1="155" x2="370" y2="165" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Toe Box Details -->
    <path d="M380 135 C405 155, 425 170, 435 188 C400 184, 370 175, 350 160 Z" fill="#1E293B" opacity="0.6"/>
    
    <!-- Accent Stitching Details -->
    <path d="M80 180 Q 150 160 220 165" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
</svg>

